syntax = "proto3";

package deployctl.v1;

option go_package = "deployctl/internal/rpc;rpc";

service DeploymentService {
  rpc CreateDeployment(CreateDeploymentRequest) returns (JobResponse);
  rpc GetDeployment(GetDeploymentRequest) returns (Deployment);
  rpc GetDeploymentStatus(GetDeploymentStatusRequest) returns (DeploymentStatus);
  rpc StreamDeploymentLogs(StreamDeploymentLogsRequest) returns (stream DeploymentLogEntry);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc ListDeploymentSummaries(ListDeploymentSummariesRequest) returns (ListDeploymentSummariesResponse);
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (JobResponse);
  rpc BuildDeployment(BuildDeploymentRequest) returns (JobResponse);
  rpc UpdateDeployment(UpdateDeploymentRequest) returns (JobResponse);
  rpc DeployDeployment(DeployDeploymentRequest) returns (JobResponse);
  rpc RestartDeployment(RestartDeploymentRequest) returns (JobResponse);
  rpc StopDeployment(StopDeploymentRequest) returns (JobResponse);
}

service EnvService {
  rpc ListEnvNames(ListEnvNamesRequest) returns (ListEnvNamesResponse);
  rpc ListEnvFiles(ListEnvFilesRequest) returns (ListEnvFilesResponse);
  rpc SetEnv(SetEnvRequest) returns (JobResponse);
  rpc ImportEnvFile(ImportEnvFileRequest) returns (JobResponse);
  rpc UnsetEnv(UnsetEnvRequest) returns (JobResponse);
}

service JobService {
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc ListJobLogs(ListJobLogsRequest) returns (ListJobLogsResponse);
  rpc WatchJob(WatchJobRequest) returns (stream JobEvent);
  rpc CancelJob(CancelJobRequest) returns (Job);
}

service SystemService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
}

message Deployment {
  string name = 1;
  string repo_url = 2;
  string location = 3;
  string compose_path = 4;
  string env_path = 5;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_NOT_CONFIGURED = 1;
  DEPLOYMENT_STATE_NOT_CREATED = 2;
  DEPLOYMENT_STATE_RUNNING = 3;
  DEPLOYMENT_STATE_PARTIAL = 4;
  DEPLOYMENT_STATE_STOPPED = 5;
}

enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RESTARTING = 2;
  CONTAINER_STATE_RUNNING = 3;
  CONTAINER_STATE_REMOVING = 4;
  CONTAINER_STATE_PAUSED = 5;
  CONTAINER_STATE_EXITED = 6;
  CONTAINER_STATE_DEAD = 7;
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_CREATE = 1;
  JOB_TYPE_DELETE = 2;
  JOB_TYPE_BUILD = 3;
  JOB_TYPE_UPDATE = 4;
  JOB_TYPE_DEPLOY = 5;
  JOB_TYPE_RESTART = 6;
  JOB_TYPE_STOP = 7;
  JOB_TYPE_ENV_SET = 8;
  JOB_TYPE_ENV_IMPORT = 9;
  JOB_TYPE_ENV_UNSET = 10;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
}

enum DockerConnectionState {
  DOCKER_CONNECTION_STATE_UNSPECIFIED = 0;
  DOCKER_CONNECTION_STATE_CONNECTED = 1;
  DOCKER_CONNECTION_STATE_PARTIALLY_CONNECTED = 2;
  DOCKER_CONNECTION_STATE_UNAVAILABLE = 3;
}

message CreateDeploymentRequest {
  string repo_url = 1;
  string deployment_name = 2;
  string compose_file = 3;
  string env_file = 4;
}

message GetDeploymentRequest { string deployment_name = 1; }
message GetDeploymentStatusRequest { string deployment_name = 1; string env_file = 2; }
message StreamDeploymentLogsRequest {
  string deployment_name = 1;
  bool follow = 2;
  int32 lines = 3;
}
message DeploymentLogEntry {
  string container = 1;
  string message = 2;
}
message DeploymentStatus {
  Deployment deployment = 1;
  DeploymentState state = 2;
  repeated ContainerStatus containers = 3;
  repeated string missing_services = 4;
  repeated string env_names = 5;
  Job latest_job = 6;
  Job latest_update_job = 7;
  int64 running_since_unix = 8;
  int64 stopped_at_unix = 9;
}
message ContainerStatus {
  string service = 1;
  string name = 2;
  string status = 3;
  ContainerState state = 4;
  string image = 5;
  string image_id = 6;
  int64 created_at_unix = 7;
  int64 started_at_unix = 8;
  int64 finished_at_unix = 9;
}
message ListDeploymentsRequest {}
message ListDeploymentsResponse { repeated Deployment deployments = 1; }
message ListDeploymentSummariesRequest {}
message ListDeploymentSummariesResponse { repeated DeploymentSummary deployments = 1; }
message DeploymentSummary {
  Deployment deployment = 1;
  DeploymentState state = 2;
}
message DeleteDeploymentRequest { string deployment_name = 1; }
message BuildDeploymentRequest { string deployment_name = 1; }
message UpdateDeploymentRequest { string deployment_name = 1; bool build = 2; }
message DeployDeploymentRequest { string deployment_name = 1; bool build = 2; }
message RestartDeploymentRequest { string deployment_name = 1; bool build = 2; }
message StopDeploymentRequest { string deployment_name = 1; }

message ListEnvNamesRequest { string deployment_name = 1; string env_file = 2; }
message ListEnvNamesResponse { repeated string names = 1; }
message ListEnvFilesRequest { string deployment_name = 1; string env_file = 2; }
message EnvFileVariables {
  string env_file = 1;
  repeated string names = 2;
}
message ListEnvFilesResponse {
  repeated EnvFileVariables env_files = 1;
  repeated string missing_env_files = 2;
}
message SetEnvRequest {
  string deployment_name = 1;
  map<string, string> variables = 2;
  string env_file = 3;
}
message ImportEnvFileRequest {
  string deployment_name = 1;
  string source_path = 2;
  string env_file = 3;
}
message UnsetEnvRequest {
  string deployment_name = 1;
  repeated string names = 2;
  string env_file = 3;
}

message JobResponse { string job_id = 1; }

message Job {
  string id = 1;
  JobType type = 2;
  string deployment_name = 3;
  JobStatus status = 4;
  string error = 5;
  int64 created_at_unix = 6;
  int64 started_at_unix = 7;
  int64 finished_at_unix = 8;
}

message GetJobRequest { string job_id = 1; }
message ListJobsRequest { string deployment_name = 1; }
message ListJobsResponse { repeated Job jobs = 1; }
message ListJobLogsRequest { string job_id = 1; int64 after_sequence = 2; }
message ListJobLogsResponse { repeated JobLog logs = 1; }
message WatchJobRequest { string job_id = 1; int64 after_sequence = 2; }
message CancelJobRequest { string job_id = 1; }

message JobLog {
  string job_id = 1;
  int64 sequence = 2;
  string message = 3;
  int64 created_at_unix = 4;
}

message JobEvent {
  string job_id = 1;
  int64 sequence = 2;
  string message = 3;
  Job job = 4;
}

message HealthRequest {}
message DockerHealth {
  DockerConnectionState state = 1;
  string host = 2;
  string server_version = 3;
  string api_version = 4;
  string os_type = 5;
  string error = 6;
}
message HealthResponse {
  bool daemon_reachable = 1;
  DockerHealth docker = 2;
}
message VersionRequest {}
message VersionResponse { string version = 1; }
message CapabilitiesRequest {}
message CapabilitiesResponse { repeated string capabilities = 1; }
